name: workora
description: Workora attendance app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  firebase_database: ^12.4.4
  firebase_storage: ^13.0.4
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  fl_chart: ^0.69.2
  pdf: ^3.11.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  device_info_plus: ^11.2.0
  http: ^1.2.2
  ntp: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/workora_logo.png"
  adaptive_icon_background: "#0B0F1F"
  adaptive_icon_foreground: "assets/images/workora_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg
    - assets/images/workora_logo.png
    - assets/icons/
